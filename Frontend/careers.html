<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers | Zenrix</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <main class="container mx-auto px-4 py-8">
        <div class="mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Join Our Team</h1>
            <p class="text-gray-600 text-lg">We're looking for talented individuals to join our growing company.</p>
        </div>

        <div id="careersContainer" class="space-y-6">
            <div class="text-center py-12">
                <p class="text-gray-500">Loading job openings...</p>
            </div>
        </div>
    </main>
    <custom-footer></custom-footer>

    <!-- Application Modal -->
    <div id="applicationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-2xl max-h-96 overflow-y-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Apply for Position</h2>
            <p id="jobTitleInModal" class="text-gray-600 mb-6 font-semibold text-lg"></p>
            <form id="applicationForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">First Name *</label>
                        <input type="text" name="firstName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Last Name *</label>
                        <input type="text" name="lastName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                        <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phone *</label>
                        <input type="tel" name="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Resume URL *</label>
                    <input type="url" name="resumeUrl" required placeholder="https://example.com/resume.pdf" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cover Letter</label>
                    <textarea name="coverLetter" rows="4" placeholder="Tell us why you're a great fit for this role..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                        Submit Application
                    </button>
                    <button type="button" id="closeApplicationModal" class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script>
        const API_URL = '/api';

        async function loadCareers() {
            try {
                const response = await fetch(`${API_URL}/careers`);
                const data = await response.json();
                
                if (data.success && data.data.length > 0) {
                    const container = document.getElementById('careersContainer');
                    container.innerHTML = data.data.map(job => `
                        <div class="bg-white rounded-lg shadow-md p-8 card-hover">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h2 class="text-2xl font-bold text-gray-800">${job.title}</h2>
                                    <div class="flex flex-wrap gap-3 mt-3">
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800">
                                            📍 ${job.location}
                                        </span>
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-purple-100 text-purple-800">
                                            🏢 ${job.department}
                                        </span>
                                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
                                            ⏱️ ${job.type}
                                        </span>
                                    </div>
                                </div>
                                ${job.salary && job.salary.min && job.salary.max ? `
                                    <div class="text-right">
                                        <p class="text-2xl font-bold text-green-600">$${job.salary.min.toLocaleString()}</p>
                                        <p class="text-sm text-gray-500">to $${job.salary.max.toLocaleString()}</p>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <p class="text-gray-700 mb-4">${job.description}</p>
                            
                            ${job.requirements && job.requirements.length > 0 ? `
                                <div class="mb-4">
                                    <h3 class="font-semibold text-gray-800 mb-2">Requirements:</h3>
                                    <ul class="list-disc list-inside space-y-1 text-gray-600">
                                        ${job.requirements.map(req => `<li>${req}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            
                            ${job.benefits && job.benefits.length > 0 ? `
                                <div class="mb-4">
                                    <h3 class="font-semibold text-gray-800 mb-2">Benefits:</h3>
                                    <ul class="list-disc list-inside space-y-1 text-gray-600">
                                        ${job.benefits.map(benefit => `<li>${benefit}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            
                            <button onclick="applyForJob('${job._id}', '${job.title}')" class="mt-6 bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                                Apply Now
                            </button>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('careersContainer').innerHTML = `
                        <div class="bg-white rounded-lg shadow-md p-12 text-center">
                            <p class="text-gray-600 text-lg">No open positions at the moment. Check back soon!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Failed to load careers:', error);
                document.getElementById('careersContainer').innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-8 text-center">
                        <p class="text-red-600">Failed to load job openings. Please try again later.</p>
                    </div>
                `;
            }
        }

        function applyForJob(jobId, jobTitle) {
            document.getElementById('jobTitleInModal').textContent = jobTitle;
            document.getElementById('applicationForm').dataset.jobId = jobId;
            document.getElementById('applicationModal').classList.remove('hidden');
        }

        document.getElementById('closeApplicationModal')?.addEventListener('click', function() {
            document.getElementById('applicationModal').classList.add('hidden');
        });

        document.getElementById('applicationModal')?.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.add('hidden');
            }
        });

        document.getElementById('applicationForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            const jobId = this.dataset.jobId;
            const formData = new FormData(this);
            
            const applicationData = {
                firstName: formData.get('firstName'),
                lastName: formData.get('lastName'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                resumeUrl: formData.get('resumeUrl'),
                coverLetter: formData.get('coverLetter'),
                status: 'submitted'
            };

            try {
                const response = await fetch(`${API_URL}/careers/${jobId}/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(applicationData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('✅ Application submitted successfully!\n\nWe will review your application and get back to you soon.');
                    document.getElementById('applicationModal').classList.add('hidden');
                    this.reset();
                } else {
                    alert('❌ Failed to submit application: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Application error:', error);
                alert('❌ Network error: ' + error.message);
            }
        });

        // Load careers on page load
        document.addEventListener('DOMContentLoaded', loadCareers);
    </script>
    <style>
        .card-hover {
            transition: all 0.3s;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
    </style>
</body>
</html>
