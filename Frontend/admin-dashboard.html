<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenrix Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .slide-in { animation: slideIn 0.3s ease-out; }
        .modal-backdrop { backdrop-filter: blur(4px); }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .image-preview { max-width: 100px; max-height: 100px; object-fit: cover; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Modern Header -->
    <div class="gradient-bg text-white shadow-lg">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
                    </svg>
                    <div>
                        <h1 class="text-2xl font-bold">Zenrix</h1>
                        <p class="text-xs opacity-90">Admin Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="adminStatus" class="bg-white bg-opacity-20 px-4 py-2 rounded-full text-sm cursor-pointer">
                        <span id="adminLoginBtn">Click to Login</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-6 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-xl shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Products</p>
                        <p id="totalProducts" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                    </div>
                    <div class="bg-blue-100 p-4 rounded-full">
                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">In Stock</p>
                        <p id="inStock" class="text-3xl font-bold text-green-600 mt-2">0</p>
                    </div>
                    <div class="bg-green-100 p-4 rounded-full">
                        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Pages</p>
                        <p id="totalPages" class="text-3xl font-bold text-purple-600 mt-2">0</p>
                    </div>
                    <div class="bg-purple-100 p-4 rounded-full">
                        <svg class="w-8 h-8 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-md p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Components</p>
                        <p id="totalComponents" class="text-3xl font-bold text-yellow-600 mt-2">0</p>
                    </div>
                    <div class="bg-yellow-100 p-4 rounded-full">
                        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="bg-white rounded-xl shadow-md mb-8">
            <div class="border-b">
                <div class="flex space-x-8 px-6">
                    <button onclick="switchTab('products')" id="tab-products" class="py-4 px-2 border-b-2 border-blue-600 text-blue-600 font-medium">
                        Products
                    </button>
                    <button onclick="switchTab('pages')" id="tab-pages" class="py-4 px-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium">
                        Pages
                    </button>
                    <button onclick="switchTab('components')" id="tab-components" class="py-4 px-2 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium">
                        Components
                    </button>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="content-products" class="p-6">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Add New Product</h2>
                    <form id="addProductForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Product Name *</label>
                                <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Price ($) *</label>
                                <input type="number" step="0.01" name="price" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                            <textarea name="description" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Category *</label>
                                <select name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <option value="electronics">Electronics</option>
                                    <option value="fashion">Fashion</option>
                                    <option value="home">Home & Kitchen</option>
                                    <option value="beauty">Beauty</option>
                                    <option value="sports">Sports</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Stock Quantity *</label>
                                <input type="number" name="stock" value="10" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Main Image URL *</label>
                            <input type="text" name="image" required placeholder="https://images.unsplash.com/photo-..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Additional Images (Optional, one per line)</label>
                            <textarea name="images" rows="3" placeholder="https://image1.jpg&#10;https://image2.jpg&#10;https://image3.jpg" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                            <p class="text-xs text-gray-500 mt-1">Enter up to 4 image URLs, one per line</p>
                        </div>
                        <div>
                            <label class="flex items-center space-x-2">
                                <input type="checkbox" name="featured" class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                                <span class="text-sm font-medium text-gray-700">Mark as Featured Product</span>
                            </label>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                            Add Product
                        </button>
                    </form>
                </div>

                <div class="mt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">All Products</h2>
                    <div id="productsList" class="space-y-4"></div>
                </div>
            </div>

            <!-- Pages Tab -->
            <div id="content-pages" class="p-6 hidden">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Add New Page</h2>
                    <form id="addPageForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Slug *</label>
                                <input type="text" name="slug" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Title *</label>
                                <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Content</label>
                            <div id="addPageEditor" class="bg-white border border-gray-300 rounded-lg" style="min-height: 200px;"></div>
                        </div>
                        <div>
                            <label class="flex items-center space-x-2">
                                <input type="checkbox" name="published" class="w-4 h-4 text-purple-600 rounded focus:ring-2 focus:ring-purple-500">
                                <span class="text-sm font-medium text-gray-700">Publish immediately</span>
                            </label>
                        </div>
                        <button type="submit" class="w-full bg-purple-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-purple-700 transition">
                            Create Page
                        </button>
                    </form>
                </div>

                <div class="mt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">All Pages</h2>
                    <div id="pagesList" class="space-y-4"></div>
                </div>
            </div>

            <!-- Components Tab -->
            <div id="content-components" class="p-6 hidden">
                <div class="mb-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Add New Component</h2>
                    <form id="addComponentForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Slug *</label>
                                <input type="text" name="slug" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
                                <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">HTML</label>
                            <textarea name="html" rows="6" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-transparent font-mono text-sm"></textarea>
                        </div>
                        <div>
                            <label class="flex items-center space-x-2">
                                <input type="checkbox" name="published" class="w-4 h-4 text-yellow-600 rounded focus:ring-2 focus:ring-yellow-500">
                                <span class="text-sm font-medium text-gray-700">Publish immediately</span>
                            </label>
                        </div>
                        <button type="submit" class="w-full bg-yellow-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-yellow-700 transition">
                            Create Component
                        </button>
                    </form>
                </div>

                <div class="mt-8">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">All Components</h2>
                    <div id="componentsList" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md slide-in">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                        Login
                    </button>
                    <button type="button" onclick="closeLoginModal()" class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div id="editProductModal" class="fixed inset-0 bg-black bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-2xl max-h-[90vh] overflow-y-auto slide-in">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Product</h2>
            <form id="editProductForm" class="space-y-4">
                <input type="hidden" name="id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Product Name *</label>
                        <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Price ($) *</label>
                        <input type="number" step="0.01" name="price" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                    <textarea name="description" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Category *</label>
                        <select name="category" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="electronics">Electronics</option>
                            <option value="fashion">Fashion</option>
                            <option value="home">Home & Kitchen</option>
                            <option value="beauty">Beauty</option>
                            <option value="sports">Sports</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Stock Quantity *</label>
                        <input type="number" name="stock" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Main Image URL *</label>
                    <input type="text" name="image" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Additional Images (Optional, one per line)</label>
                    <textarea name="images" rows="3" placeholder="https://image1.jpg&#10;https://image2.jpg&#10;https://image3.jpg" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div>
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" name="featured" class="w-4 h-4 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                        <span class="text-sm font-medium text-gray-700">Mark as Featured Product</span>
                    </label>
                </div>
                <div class="flex space-x-3">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                        Update Product
                    </button>
                    <button type="button" onclick="closeEditProductModal()" class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-6 right-6 z-50 space-y-2"></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        const API_URL = '/api';
        let quillAdd = null;
        let productsCache = {};

        // Toast notification
        function showToast(type, message) {
            const toast = document.createElement('div');
            toast.className = `slide-in px-6 py-4 rounded-lg shadow-lg ${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            } text-white max-w-md`;
            toast.textContent = message;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // Token management
        function getAdminToken() {
            return localStorage.getItem('adminToken');
        }

        function setAdminToken(token) {
            localStorage.setItem('adminToken', token);
            updateAdminUI();
        }

        function clearAdminToken() {
            localStorage.removeItem('adminToken');
            updateAdminUI();
        }

        function updateAdminUI() {
            const token = getAdminToken();
            const statusEl = document.getElementById('adminStatus');
            const btnEl = document.getElementById('adminLoginBtn');
            
            if (token) {
                statusEl.classList.add('bg-green-500');
                statusEl.classList.remove('bg-white', 'bg-opacity-20');
                btnEl.textContent = 'Logged In ✓';
                btnEl.onclick = logout;
            } else {
                statusEl.classList.remove('bg-green-500');
                statusEl.classList.add('bg-white', 'bg-opacity-20');
                btnEl.textContent = 'Click to Login';
                btnEl.onclick = openLoginModal;
            }
        }

        // Login functionality
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = e.target.password.value;
            
            try {
                const res = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await res.json();
                
                if (data.success && data.token) {
                    setAdminToken(data.token);
                    closeLoginModal();
                    showToast('success', '✅ Login successful!');
                    loadAllData();
                } else {
                    showToast('error', '❌ Invalid password');
                }
            } catch (err) {
                showToast('error', '❌ Login failed: ' + err.message);
            }
        });

        function logout() {
            if (confirm('Logout from admin?')) {
                clearAdminToken();
                showToast('success', 'Logged out successfully');
            }
        }

        // Tab switching
        function switchTab(tab) {
            ['products', 'pages', 'components'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('border-blue-600', 'text-blue-600');
                document.getElementById(`tab-${t}`).classList.add('border-transparent', 'text-gray-500');
                document.getElementById(`content-${t}`).classList.add('hidden');
            });
            
            document.getElementById(`tab-${tab}`).classList.add('border-blue-600', 'text-blue-600');
            document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById(`content-${tab}`).classList.remove('hidden');
        }

        // Products CRUD
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`);
                const data = await res.json();
                
                if (data.success) {
                    productsCache = {};
                    data.data.forEach(p => productsCache[p._id] = p);
                    
                    document.getElementById('totalProducts').textContent = data.count;
                    document.getElementById('inStock').textContent = data.data.filter(p => p.stock > 0).length;
                    
                    const list = document.getElementById('productsList');
                    list.innerHTML = data.data.map(p => {
                        const images = p.images && p.images.length > 0 ? p.images : [p.image];
                        return `
                        <div class="bg-white border border-gray-200 rounded-lg p-6 card-hover">
                            <div class="flex items-start justify-between">
                                <div class="flex items-start space-x-4 flex-1">
                                    ${p.image ? `<img src="${p.image}" alt="${p.name}" class="w-20 h-20 object-cover rounded-lg">` : ''}
                                    <div class="flex-1">
                                        <h3 class="font-semibold text-gray-800 text-lg">${p.name}</h3>
                                        <p class="text-sm text-gray-600 mt-1">${p.description || ''}</p>
                                        <div class="flex items-center space-x-4 mt-2 text-sm">
                                            <span class="text-blue-600 font-semibold">$${p.price}</span>
                                            <span class="text-gray-500">${p.category}</span>
                                            <span class="${p.stock > 0 ? 'text-green-600' : 'text-red-600'}">Stock: ${p.stock}</span>
                                            ${p.featured ? '<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded text-xs">Featured</span>' : ''}
                                        </div>
                                        ${images.length > 1 ? `
                                        <div class="flex space-x-2 mt-3">
                                            ${images.slice(0, 4).map(img => `<img src="${img}" class="image-preview rounded border">`).join('')}
                                        </div>
                                        ` : ''}
                                    </div>
                                </div>
                                <div class="flex flex-col space-y-2 ml-4">
                                    <button onclick="editProduct('${p._id}')" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg hover:bg-blue-200 transition whitespace-nowrap">
                                        Edit
                                    </button>
                                    <button onclick="deleteProduct('${p._id}')" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition whitespace-nowrap">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `}).join('');
                }
            } catch (err) {
                showToast('error', 'Failed to load products: ' + err.message);
            }
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            const formData = new FormData(e.target);
            const imagesText = formData.get('images') || '';
            const imagesArray = imagesText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            
            const data = {
                name: formData.get('name'),
                price: parseFloat(formData.get('price')),
                description: formData.get('description'),
                category: formData.get('category'),
                stock: parseInt(formData.get('stock')),
                image: formData.get('image'),
                images: imagesArray,
                featured: formData.get('featured') === 'on'
            };

            try {
                const res = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showToast('success', '✅ Product created!');
                    e.target.reset();
                    loadProducts();
                } else {
                    showToast('error', '❌ Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        });

        window.editProduct = function(id) {
            console.log('Edit product clicked:', id);
            const product = productsCache[id];
            console.log('Product from cache:', product);
            
            if (!product) {
                showToast('error', 'Product not found in cache');
                console.error('Product not found in cache. Available IDs:', Object.keys(productsCache));
                return;
            }

            const form = document.getElementById('editProductForm');
            if (!form) {
                showToast('error', 'Edit form not found');
                console.error('Edit form not found');
                return;
            }

            form.elements['id'].value = product._id;
            form.elements['name'].value = product.name;
            form.elements['price'].value = product.price;
            form.elements['description'].value = product.description || '';
            form.elements['category'].value = product.category;
            form.elements['stock'].value = product.stock;
            form.elements['image'].value = product.image;
            form.elements['images'].value = (product.images || []).join('\n');
            form.elements['featured'].checked = product.featured || false;

            const modal = document.getElementById('editProductModal');
            if (modal) {
                modal.classList.remove('hidden');
                console.log('Edit modal opened');
            } else {
                console.error('Edit modal not found');
            }
        }

        function closeEditProductModal() {
            document.getElementById('editProductModal').classList.add('hidden');
        }

        document.getElementById('editProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            const formData = new FormData(e.target);
            const id = formData.get('id');
            const imagesText = formData.get('images') || '';
            const imagesArray = imagesText.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            
            const data = {
                name: formData.get('name'),
                price: parseFloat(formData.get('price')),
                description: formData.get('description'),
                category: formData.get('category'),
                stock: parseInt(formData.get('stock')),
                image: formData.get('image'),
                images: imagesArray,
                featured: formData.get('featured') === 'on'
            };

            try {
                const res = await fetch(`${API_URL}/products/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showToast('success', '✅ Product updated!');
                    closeEditProductModal();
                    loadProducts();
                } else {
                    showToast('error', '❌ Update failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        });

        window.deleteProduct = async function(id) {
            console.log('Delete product clicked:', id);
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            console.log('Attempting to delete product:', id);
            
            try {
                const res = await fetch(`${API_URL}/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                console.log('Delete response status:', res.status);
                const data = await res.json();
                console.log('Delete response data:', data);

                if (data.success) {
                    showToast('success', '✅ Product deleted successfully!');
                    loadProducts();
                } else {
                    showToast('error', '❌ Delete failed: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Delete error:', err);
                showToast('error', '❌ Network error: ' + err.message);
            }
        }

        // Pages CRUD
        async function loadPages() {
            try {
                const res = await fetch(`${API_URL}/pages`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('totalPages').textContent = data.count;
                    
                    const list = document.getElementById('pagesList');
                    list.innerHTML = data.data.map(p => `
                        <div class="bg-white border border-gray-200 rounded-lg p-6 card-hover">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-semibold text-gray-800">${p.title}</h3>
                                    <p class="text-sm text-gray-500">/${p.slug} • ${p.published ? '✓ Published' : 'Draft'}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="deletePage('${p._id}')" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                showToast('error', 'Failed to load pages');
            }
        }

        document.getElementById('addPageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            const formData = new FormData(e.target);
            const content = quillAdd ? quillAdd.root.innerHTML : '';
            
            const data = {
                slug: formData.get('slug'),
                title: formData.get('title'),
                content: content,
                published: formData.get('published') === 'on'
            };

            try {
                const res = await fetch(`${API_URL}/pages`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showToast('success', '✅ Page created!');
                    e.target.reset();
                    if (quillAdd) quillAdd.root.innerHTML = '';
                    loadPages();
                } else {
                    showToast('error', '❌ Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        });

        async function deletePage(id) {
            if (!confirm('Delete this page?')) return;
            
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            try {
                const res = await fetch(`${API_URL}/pages/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();

                if (data.success) {
                    showToast('success', '✅ Page deleted!');
                    loadPages();
                } else {
                    showToast('error', '❌ Delete failed: ' + data.error);
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        }

        // Components CRUD
        async function loadComponents() {
            try {
                const res = await fetch(`${API_URL}/components`);
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('totalComponents').textContent = data.count;
                    
                    const list = document.getElementById('componentsList');
                    list.innerHTML = data.data.map(c => `
                        <div class="bg-white border border-gray-200 rounded-lg p-6 card-hover">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-semibold text-gray-800">${c.name}</h3>
                                    <p class="text-sm text-gray-500">${c.slug} • ${c.published ? '✓ Published' : 'Draft'}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="deleteComponent('${c._id}')" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition">
                                        Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                showToast('error', 'Failed to load components');
            }
        }

        document.getElementById('addComponentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            const formData = new FormData(e.target);
            const data = {
                slug: formData.get('slug'),
                name: formData.get('name'),
                html: formData.get('html'),
                published: formData.get('published') === 'on'
            };

            try {
                const res = await fetch(`${API_URL}/components`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await res.json();

                if (result.success) {
                    showToast('success', '✅ Component created!');
                    e.target.reset();
                    loadComponents();
                } else {
                    showToast('error', '❌ Failed: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        });

        async function deleteComponent(id) {
            if (!confirm('Delete this component?')) return;
            
            const token = getAdminToken();
            if (!token) {
                showToast('error', 'Please login first');
                openLoginModal();
                return;
            }

            try {
                const res = await fetch(`${API_URL}/components/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();

                if (data.success) {
                    showToast('success', '✅ Component deleted!');
                    loadComponents();
                } else {
                    showToast('error', '❌ Delete failed: ' + data.error);
                }
            } catch (err) {
                showToast('error', '❌ Network error: ' + err.message);
            }
        }

        // Load all data
        function loadAllData() {
            loadProducts();
            loadPages();
            loadComponents();
        }

        // Initialize Quill editors
        function initQuill() {
            if (window.Quill) {
                try {
                    quillAdd = new Quill('#addPageEditor', {
                        theme: 'snow',
                        placeholder: 'Write your page content here...'
                    });
                } catch (e) {
                    console.warn('Quill init failed:', e);
                }
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            updateAdminUI();
            loadAllData();
            setTimeout(initQuill, 100);
        });
    </script>
</body>
</html>
