<div id="fashionhub-chatbot" class="fashionhub-chatbot">
  <button class="chat-toggle" id="chatbotToggle" aria-label="Open chat">
    <img class="chat-avatar" src="/uploads/avatars/chat-avatar.png?v=1" alt="Chatbot Avatar" />
  </button>

  <div class="chat-window" id="chatbotWindow" aria-hidden="true">
    <div class="chat-head">
      <div class="chat-title">
        <img class="chat-head-avatar" src="/uploads/avatars/chat-avatar.png?v=1" alt="Fashion Hub Assistant" />
        <div>
          <div class="title">Fashion Hub Assistant</div>
          <div class="subtitle">How can I help you today?</div>
        </div>
      </div>
      <button id="chatClose" class="chat-close" aria-label="Close chat">✕</button>
    </div>

    <div class="chat-body" id="chatbotMessages" role="log" aria-live="polite"></div>

    <div class="chat-footer">
      <input id="chatbotInput" placeholder="Type a message..." aria-label="Message">
      <button id="chatbotSend" aria-label="Send message">Send</button>
    </div>
  </div>
</div>

<style>
  .fashionhub-chatbot { position: fixed; right: 24px; bottom: 24px; z-index: 9999; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; }
  .chat-toggle { width: 64px; height: 64px; border-radius: 50%; border: none; padding: 0; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(2,6,23,0.4); background: linear-gradient(135deg,#0ea5a9,#0ea5a9); cursor: pointer; }
  .chat-toggle img { width: 56px; height: 56px; border-radius: 50%; display: block; }
  .chat-avatar { width: 56px; height: 56px; display: block; border-radius: 50%; object-fit: cover; object-position: center 18%; }

  .chat-window { width: 340px; max-height: 520px; display: none; flex-direction: column; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 60px rgba(2,6,23,0.45); overflow: hidden; }
  .chat-head { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; background: linear-gradient(90deg,#0ea5a9,#0f9aa8); color:#fff; }
  .chat-title { display:flex; gap:10px; align-items:center; }
  .chat-head-avatar { width:42px; height:42px; border-radius:50%; object-fit:cover; object-position: center 18%; }
  .title { font-weight:700; }
  .subtitle { font-size:12px; opacity:0.9; }
  .chat-close { background:transparent; border:none; color:#fff; font-size:18px; cursor:pointer; }

  .chat-body { padding:12px; height:320px; overflow-y:auto; background:linear-gradient(180deg,#f7f9fb,#ffffff); display:flex; flex-direction:column; gap:10px; }

  .bubble { max-width:78%; padding:10px 12px; border-radius:12px; font-size:14px; line-height:1.3; }
  .bubble.bot { background:#eef6f6; color:#0f172a; align-self:flex-start; display:flex; gap:8px; align-items:flex-end; }
  .bubble.user { background:linear-gradient(90deg,#0f172a,#111827); color:#fff; align-self:flex-end; }
  .bubble img { width:48px; height:48px; border-radius:8px; object-fit:cover; }

  /* Typing indicator */
  .bubble.typing-indicator { background: #eef6f6; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: #0f172a; display: inline-block; margin: 0 2px; animation: typing 1.4s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }

  /* Rating buttons */
  .rating-buttons { font-size: 12px; }
  .rating-btn { padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; transition: all 0.2s; font-size: 12px; }
  .rating-btn:hover { background: #f0f0f0; border-color: #999; }
  .rating-btn:active { transform: scale(0.95); }

  /* Quick replies */
  .quick-replies { font-size: 12px; }
  .quick-reply-btn { padding: 6px 10px; border: 1px solid #0ea5a9; border-radius: 6px; background: white; color: #0f172a; cursor: pointer; transition: all 0.2s; font-size: 12px; font-weight: 500; }
  .quick-reply-btn:hover { background: #0ea5a9; color: white; }
  .quick-reply-btn:active { transform: scale(0.95); }

  .chat-footer { display:flex; gap:8px; padding:10px; border-top:1px solid #eee; }
  .chat-footer input { flex:1; padding:10px 12px; border-radius:10px; border:1px solid #e6eef0; outline:none; }
  .chat-footer button { padding:8px 12px; border-radius:10px; border:none; background:#0f172a; color:#fff; cursor:pointer; }

  @media (max-width:420px){ .chat-window{ right:12px; left:12px; width:calc(100% - 24px); } }
</style>
