<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | ShopNest</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <main class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-8">
            <div id="pageContent" class="prose max-w-none"></div>
        </div>
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white p-6 rounded-lg shadow-sm">
                    <div class="flex items-center mb-6">
                        <img src="http://static.photos/people/200x200/5" alt="User" class="w-12 h-12 rounded-full mr-4">
                        <div>
                            <h3 class="font-semibold">John Doe</h3>
                            <span class="text-sm text-gray-500">Gold Member</span>
                        </div>
                    </div>
                    <ul class="space-y-2">
                        <li><a href="/account.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="3"/><path d="M4 20a8 8 0 0 1 16 0"/></svg> My Profile</a></li>
                        <li><a href="/orders.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M21 16V8l-9-5-9 5v8l9 5 9-5z"/></svg> My Orders</a></li>
                        <li><a href="/wishlist.html" class="flex items-center p-2 rounded-lg bg-blue-50 text-blue-600">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20.8 4.6c-1.4-1.6-3.9-1.8-5.6-.4l-.7.6-.7-.6C11.1 2 9 2.2 7.6 3.8c-2.1 2.4-2 6 0 8.5L12 21l4.4-9.7c2-2.5 2.1-6.1 0-8.7z"/></svg> Wishlist</a></li>
                        <li><a href="/addresses.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/><circle cx="12" cy="9" r="2"/></svg> Addresses</a></li>
                        <li><a href="/settings.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z"/><path d="M19.4 15a1.6 1.6 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.82-.33 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.06a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .33-1.82 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.06a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.33-1.82l-.06-.06A2 2 0 0 1 7.3 3.7l.06.06a1.6 1.6 0 0 0 1.82.33H9.7a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.06a1.6 1.6 0 0 0 1 1.5h.06a1.6 1.6 0 0 0 1.82-.33l.06-.06A2 2 0 0 1 20.6 6.7z"/></svg> Settings</a></li>
                        <li><a href="/logout.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100 text-red-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M17 16l4-4-4-4"/><path d="M7 12h14"/><path d="M7 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3"/></svg> Logout</a></li>
                    </ul>
                </div>
            </aside>

            <div class="flex-grow">
                <h1 class="text-3xl font-bold mb-6">My Wishlist</h1>
                
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="wishlistItems">
                        <div class="product-card relative bg-white rounded-lg shadow-sm overflow-hidden hover:shadow-md transition">
                            <button class="absolute top-2 right-2 text-red-500 hover:text-red-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 inline-block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                            <a href="/product.html?id=1">
                                <div class="product-image h-48 bg-gray-100 flex items-center justify-center">
                                    <img src="http://static.photos/technology/320x240/1" alt="Wireless Headphones" class="h-full object-cover">
                                </div>
                                <div class="p-4">
                                    <h3 class="font-semibold text-lg mb-1">Wireless Headphones</h3>
                                    <div class="flex items-center mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 inline-block text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.455a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118L10 13.347l-3.448 2.441c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.568 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 inline-block text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.455a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118L10 13.347l-3.448 2.441c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.568 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 inline-block text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.455a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118L10 13.347l-3.448 2.441c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.568 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 inline-block text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.455a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118L10 13.347l-3.448 2.441c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.568 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 inline-block text-yellow-400" viewBox="0 0 20 20" fill="currentColor"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.955a1 1 0 00.95.69h4.162c.969 0 1.371 1.24.588 1.81l-3.37 2.455a1 1 0 00-.364 1.118l1.287 3.955c.3.921-.755 1.688-1.54 1.118L10 13.347l-3.448 2.441c-.784.57-1.838-.197-1.539-1.118l1.287-3.955a1 1 0 00-.364-1.118L2.568 9.382c-.783-.57-.38-1.81.588-1.81h4.162a1 1 0 00.95-.69L9.049 2.927z"/></svg>
                                    </div>
                                    <p class="text-blue-600 font-bold">$99.99</p>
                                </div>
                            </a>
                            <button class="w-full bg-blue-600 text-white py-2 hover:bg-blue-700 transition">Add to Cart</button>
                        </div>
                    </div>

                    <div class="text-center mt-12 py-12" id="emptyWishlist">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 inline-block text-gray-300 mb-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M20.8 4.6c-1.4-1.6-3.9-1.8-5.6-.4l-.7.6-.7-.6C11.1 2 9 2.2 7.6 3.8c-2.1 2.4-2 6 0 8.5L12 21l4.4-9.7c2-2.5 2.1-6.1 0-8.7z"/></svg>
                        <p class="text-gray-500 text-lg mb-4">Your wishlist is empty</p>
                        <a href="/products.html" class="inline-block bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                            Browse Products
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</body>
</html>
