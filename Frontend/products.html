<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Zenrix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/css/tailwind-site.css">
    <script src="/js/format-utils.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="surface text products-page">
  <custom-navbar></custom-navbar>
  <main class="relative">
    <section class="relative overflow-hidden products-hero py-14">
      <div class="absolute inset-0 opacity-30 products-hero-overlay"></div>
      <div class="container mx-auto px-4 relative">
        <div class="flex flex-wrap items-center justify-between gap-6">
          <div class="space-y-4 max-w-2xl">
            <p class="text-xs uppercase tracking-[0.4em] text-indigo-300 font-medium">Products</p>
            <h1 class="text-4xl md:text-5xl font-black leading-tight text">Browse the latest drops.</h1>
            <p class="muted max-w-xl">Filter by price, sort by what matters, and jump straight to sale picks when you want the best deals.</p>
            <div class="flex flex-wrap gap-2 text-sm">
              <a href="/products.html" class="px-4 py-2 rounded-full bg-accent">All</a>
              <a href="/products.html?category=sale" class="px-4 py-2 rounded-full surface-2 border text muted font-medium transition">On Sale</a>
              <a href="/products.html?category=electronics" class="px-4 py-2 rounded-full surface-2 border text muted font-medium transition">Electronics</a>
              <a href="/products.html?category=fashion" class="px-4 py-2 rounded-full surface-2 border text muted font-medium transition">Fashion</a>
              <a href="/products.html?category=home" class="px-4 py-2 rounded-full surface-2 border text muted font-medium transition">Home</a>
              <a href="/products.html?category=beauty" class="px-4 py-2 rounded-full surface-2 border text muted font-medium transition">Beauty</a>
            </div>
          </div>
          <div class="products-filter-card">
            <div class="flex items-center justify-between mb-2">
              <span class="filter-label">Sort</span>
              <select id="sort" class="filter-select">
                <option value="popular">Most Popular</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="newest">Newest</option>
              </select>
            </div>
            <div class="mt-5">
              <div class="flex items-center justify-between mb-2">
                <span class="filter-label">Max price</span>
                <span id="priceFilterValue" class="price-value">रु 1,000</span>
              </div>
              <input id="priceFilter" type="range" min="0" max="1000" value="1000" step="50" data-default-max="1000" class="filter-range">
              <p class="filter-hint">Drag to cap prices. Uses sale price when applicable.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container mx-auto px-4 py-12">
      <div id="pageContent" class="prose prose-invert max-w-none mb-10"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="productsGrid"></div>
    </section>
  </main>
  <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
<!-- ========== ZENRIX CHATBOT ========== -->
<div id="chatbot-container">
  <button id="chatbot-toggle" class="fixed bottom-6 right-6 bg-accent text w-14 h-14 rounded-full shadow-lg transition-all z-50 flex items-center justify-center" aria-label="Open chat">
    <img src="/uploads/avatars/chat-avatar.png?v=2" alt="Chatbot Avatar" style="width:56px;height:56px;display:block;border-radius:50%;object-fit:cover;" />
  </button>

  <div id="chatbot-window" class="fixed bottom-24 right-6 w-80 h-96 bg-white rounded-lg shadow-xl hidden flex flex-col z-50 border">
    <div class="bg-accent p-3 rounded-t-lg flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="/uploads/avatars/chat-avatar.png?v=2" alt="Zenrix Assistant" style="width:32px;height:32px;border-radius:50%;object-fit:cover;" />
        <div>
          <div class="font-bold">Zenrix Assistant</div>
          <div class="text-xs opacity-80">Online • 24/7 Support</div>
        </div>
      </div>
      <button id="chatbot-close" aria-label="Close chat" class="text">✕</button>
    </div>

    <div id="chatbot-messages" class="flex-grow p-3 overflow-y-auto space-y-3 bg-white"></div>

    <div class="border-t p-3 bg-white">
      <div class="flex space-x-2">
        <input type="text" id="chatbot-input" placeholder="Type your message..." class="flex-grow border rounded-lg px-3 py-2 focus:outline-none">
        <button id="chatbot-send" class="bg-blue-600 text-white px-3 py-2 rounded-lg">Send</button>
      </div>
      <div class="flex flex-wrap gap-2 mt-3">
        <button class="quick-btn" data-msg="What products do you have?">Products</button>
        <button class="quick-btn" data-msg="What is delivery time?">Delivery</button>
        <button class="quick-btn" data-msg="How to return product?">Returns</button>
        <button class="quick-btn" data-msg="Contact support">Contact</button>
      </div>
    </div>
  </div>
</div>

<!-- Chatbot JS (external) -->
<script src="js/chatbot-enhanced.js" defer></script>
<!-- ========== END CHATBOT ========== -->
</body>
</html>
