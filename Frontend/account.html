<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | ShopNest</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js" defer></script>
</head>
<body class="bg-gray-50">
    <custom-navbar></custom-navbar>
    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row gap-8">
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white p-6 rounded-lg shadow-sm">
                    <div class="flex items-center mb-6">
                        <img src="http://static.photos/people/200x200/5" alt="User" class="w-12 h-12 rounded-full mr-4">
                        <div>
                            <h3 class="font-semibold">John Doe</h3>
                            <span class="text-sm text-gray-500">Gold Member</span>
                        </div>
                    </div>
                    <ul class="space-y-2">
                        <li><a href="/account.html" class="flex items-center p-2 rounded-lg bg-blue-50 text-blue-600">
                            <i class="fas fa-user-circle mr-3"></i> My Profile</a></li>
                        <li><a href="/orders.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <i class="fas fa-box-open mr-3"></i> My Orders</a></li>
                        <li><a href="/wishlist.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <i class="fas fa-heart mr-3"></i> Wishlist</a></li>
                        <li><a href="/addresses.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <i class="fas fa-map-marker-alt mr-3"></i> Addresses</a></li>
                        <li><a href="/settings.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100">
                            <i class="fas fa-cog mr-3"></i> Settings</a></li>
                        <li><a href="/logout.html" class="flex items-center p-2 rounded-lg hover:bg-gray-100 text-red-500">
                            <i class="fas fa-sign-out-alt mr-3"></i> Logout</a></li>
                    </ul>
                </div>
            </aside>

            <div class="flex-grow">
                <div class="bg-white p-6 rounded-lg shadow-sm">
                    <h2 class="text-2xl font-bold mb-6">My Profile</h2>
                    <form>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-gray-700 mb-2">First Name</label>
                            <input type="text" id="firstName" class="w-full border rounded-lg px-4 py-2" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Last Name</label>
                            <input type="text" id="lastName" class="w-full border rounded-lg px-4 py-2" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Email</label>
                            <input type="email" id="email" class="w-full border rounded-lg px-4 py-2" required>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Phone</label>
                            <input type="tel" id="phone" class="w-full border rounded-lg px-4 py-2">
                        </div>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                        Save Changes
                    </button>
                    <div id="accountSuccess" class="mt-4 text-green-600 hidden">Profile updated successfully!</div>
                    <div id="accountError" class="mt-4 text-red-600 hidden">Error updating profile. Please try again.</div>
</form>
                </div>
            </div>
        </div>
    </main>
    <custom-footer></custom-footer>

    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
</body>
</html>
