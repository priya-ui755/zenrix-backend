name: E2E Admin Flows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.adminCommand(\"ping\")'" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Wait for Mongo
        run: |
          echo "Waiting for Mongo to accept connections..."
          for i in `seq 1 30`; do
            if nc -z localhost 27017; then
              echo "Mongo is up"; break
            fi
            sleep 1
          done

      - name: Ensure ADMIN_PASSWORD secret exists
        run: |
          if [ -z "${{ secrets.ADMIN_PASSWORD }}" ]; then
            echo "::error::ADMIN_PASSWORD secret is not set. Please add it in repository settings -> Secrets and variables -> Actions -> New repository secret.";
            exit 1;
          fi

      - name: Start server
        env:
          MONGODB_URI: mongodb://localhost:27017/fashionhub_test
          NODE_ENV: test
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          echo "Starting server in background"
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          echo "Waiting for server to respond on http://localhost:3000..."
          for i in `seq 1 30`; do
            if curl -sSf http://localhost:3000/ >/dev/null 2>&1; then
              echo "Server ready"; break
            fi
            sleep 1
          done

      - name: Run E2E scripts
        env:
          API_URL: http://localhost:3000/api
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MONGODB_URI: mongodb://localhost:27017/fashionhub_test
        run: |
          node scripts/e2e_contact_no_footer_sync.js
          node scripts/e2e_footer_push_to_contact.js
          node scripts/e2e_tab_isolation_test.js

      - name: Upload artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            server.log
            tmp/**

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi
          sleep 1
